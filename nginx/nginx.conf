# =============================================================================
# Kiosco POS — nginx.conf
# =============================================================================

user nginx;

worker_processes auto;

error_log /var/log/nginx/error.log warn;

pid /var/run/nginx.pid;


events {
    worker_connections 1024;
}


http {

    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    sendfile on;

    tcp_nopush on;

    keepalive_timeout 65;

    server_tokens off;

    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;


    # =========================================================================
    # IP real del cliente y HTTPS detrás del Nginx del host
    # =========================================================================

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Si el host terminó TLS, PHP debe ver HTTPS (URLs https, cookies, @vite).
    map $http_x_forwarded_proto $fcgi_https {
        default "";
        https   on;
    }


    # =========================================================================
    # Rate limiting
    # =========================================================================
    #
    # Los empleados de un local comparten la IP pública: los límites tienen que
    # tolerar varios logins seguidos (cambio de turno). Laravel además limita
    # los intentos fallidos por usuario+IP.
    #

    limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

    limit_req_status 429;


    include /etc/nginx/conf.d/*.conf;
}
