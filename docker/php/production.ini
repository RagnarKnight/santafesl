; PHP de producción (contenedor "app"). Se copia a conf.d/ en el Dockerfile.
; Alineado con nginx/default.conf: client_max_body_size 8M.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
cgi.fix_pathinfo = 0
zend.exception_ignore_args = On
memory_limit = 128M
max_execution_time = 30
upload_max_filesize = 6M
post_max_size = 8M

; El código es inmutable dentro de la imagen: no hace falta revisar fechas.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
