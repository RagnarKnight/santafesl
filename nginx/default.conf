# =============================================================================
# Kiosco POS — servidor Laravel (contenedor "web")
# =============================================================================

server {

    listen 8080;

    server_name _;


    root /var/www/html/public;

    index index.php;


    # =========================================================================
    # Límites
    # =========================================================================
    #
    # Alineado con PHP (docker/php/production.ini): upload_max_filesize=6M,
    # post_max_size=8M. Los comprobantes e imágenes de la app se limitan a 5 MB.
    # El Nginx del host debe usar el mismo valor (o más, nunca menos).
    #

    client_max_body_size 8M;

    add_header X-Content-Type-Options "nosniff" always;


    # =========================================================================
    # Aplicación
    # =========================================================================

    location / {

        limit_req zone=general burst=100 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }


    location = /login {

        limit_req zone=login burst=10 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }



    # =========================================================================
    # Assets de Vite (nombres con hash: se pueden cachear por mucho tiempo)
    # =========================================================================

    location ^~ /build/ {

        access_log off;

        expires 1y;

        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }


    # =========================================================================
    # Storage PÚBLICO (imágenes de productos, logos)
    # =========================================================================
    #
    # /storage apunta SOLO a storage/app/public, que viene dentro de esta imagen
    # (ver Dockerfile.nginx). Nada más de storage/ existe en este contenedor.
    #

    location ^~ /storage/ {

        access_log off;

        expires 7d;

        add_header X-Content-Type-Options "nosniff" always;

        # Nunca ejecutar ni servir código desde storage.
        location ~* \.(php|phtml|phar)$ {
            return 403;
        }

        try_files $uri =404;
    }

    # =========================================================================
    # Otros archivos estáticos
    # =========================================================================

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf)$ {

        expires 7d;

        access_log off;

        log_not_found off;
    }


    location = /favicon.ico {

        access_log off;

        log_not_found off;
    }


    location = /robots.txt {

        access_log off;

        log_not_found off;
    }


    # =========================================================================
    # PHP-FPM
    # =========================================================================

    location ~ \.php$ {

        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;

        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_param HTTPS $fcgi_https if_not_empty;

        fastcgi_read_timeout 60s;
    }


    # =========================================================================
    # Protección de archivos sensibles
    # =========================================================================

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /(composer\.(json|lock))$ {
        deny all;
    }

    location ~* /(package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock)$ {
        deny all;
    }

    location ~* \.(env|ini|log|conf|sql|sqlite|bak|backup|dist|example)$ {
        deny all;
    }
}
